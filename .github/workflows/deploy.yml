# ============================================================
# CI/CD PIPELINE - BACKEND (Vendure + Node.js)
# Repo: HSinhz/portofio_newbie
#
# Flow:
#   Push lên dev  → CI: Type Check + Build
#   Push lên main → CI pass → CD: Build + Push Docker Hub
#
# Secrets cần thiết (Settings → Secrets → Actions):
#   DOCKER_USERNAME : Docker Hub username
#   DOCKER_PASSWORD : Docker Hub password hoặc Access Token
# ============================================================

name: "CI/CD Backend"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------
  # JOB 1: CI - Kiểm tra code
  # Chạy khi: push lên main hoặc dev, hoặc PR vào main
  # ------------------------------------------------------------
  ci:
    name: "CI - Type Check & Build"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Lấy source code"
        uses: actions/checkout@v4

      - name: "2. Cài Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "3. Cài dependencies"
        run: npm ci

      - name: "4. Kiểm tra TypeScript"
        run: npx tsc --noEmit

      - name: "5. Build source code"
        run: npm run build

  # ------------------------------------------------------------
  # JOB 2: CD - Build & Push Docker image lên Docker Hub
  # Chỉ chạy khi: push lên main VÀ CI đã pass
  # ------------------------------------------------------------
  cd:
    name: "CD - Push Docker Hub"
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: "1. Lấy source code"
        uses: actions/checkout@v4

      - name: "2. Login vào Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "3. Thiết lập Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "4. Build và Push image lên Docker Hub"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mason-shop-back:latest
            ${{ secrets.DOCKER_USERNAME }}/mason-shop-back:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "5. Thông báo kết quả"
        run: |
          echo "============================================"
          echo "✅ CD Backend hoàn thành!"
          echo "Image đã push lên Docker Hub:"
          echo "  ${{ secrets.DOCKER_USERNAME }}/mason-shop-back:latest"
          echo "  ${{ secrets.DOCKER_USERNAME }}/mason-shop-back:${{ github.sha }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "============================================"
